name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore ./Projekat/LabSistem.backend/LabSistem.slnx

      - name: Build
        run: dotnet build ./Projekat/LabSistem.backend/LabSistem.slnx --no-restore

      - name: Test
        run: dotnet test ./Projekat/LABsistem.Tests/LABsistem.Tests.csproj --no-build --logger "console;verbosity=normal"

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    env:
      CYPRESS_INSTALL_BINARY: "0"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Projekat/LABsistem.Frontend/package-lock.json

      - name: Install dependencies
        working-directory: Projekat/LABsistem.Frontend
        run: npm ci

      - name: Audit production dependencies
        working-directory: Projekat/LABsistem.Frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        working-directory: Projekat/LABsistem.Frontend
        run: npm run build
