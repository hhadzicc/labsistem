version: '3.8'

services:
  db:
    image: postgres:16
    container_name: labsistem-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - labsistem_pgdata:/var/lib/postgresql/data
    networks:
      - labsistem-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  labsistem.api:
    build:
      context: .
      dockerfile: LABsistem.Presentation/Dockerfile
    container_name: labsistem-api
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ASPNETCORE_URLS=${ASPNETCORE_URLS}
      - ConnectionStrings__Default=${CONNECTION_STRING}
      - Jwt__Key=${JWT_KEY}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - FROM_EMAIL=${FROM_EMAIL}
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL}
      - SeedData__DemoUsers=${SEED_DEMO_USERS:-true}
      - BootstrapAdmin__Enabled=${BOOTSTRAP_ADMIN_ENABLED:-false}
      - BootstrapAdmin__Name=${BOOTSTRAP_ADMIN_NAME:-}
      - BootstrapAdmin__Email=${BOOTSTRAP_ADMIN_EMAIL:-}
      - BootstrapAdmin__Username=${BOOTSTRAP_ADMIN_USERNAME:-}
      - BootstrapAdmin__Password=${BOOTSTRAP_ADMIN_PASSWORD:-}
      - TZ=Europe/Sarajevo
    ports:
      - "8080:8080"
    networks:
      - labsistem-network
    depends_on:
      db:
        condition: service_healthy

  labsistem.frontend:
    build:
      context: ../LABsistem.Frontend
      dockerfile: Dockerfile
    container_name: labsistem-frontend
    ports:
      - "3001:80"
    networks:
      - labsistem-network
    depends_on:
      labsistem.api:
        condition: service_started

volumes:
  labsistem_pgdata:

networks:
  labsistem-network:
    name: labsistem-network
